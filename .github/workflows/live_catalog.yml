name: Update live cam catalog

on:
  schedule:
    - cron: "17 1,9,17 * * *"   # 3 times a day
  workflow_dispatch: {}           # "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python build_live_catalog.py --budget 30
      - name: Save catalog
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog/live_catalog.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update live catalog"
            git push
          fi
